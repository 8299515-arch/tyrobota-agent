version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tyrobota_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: tyrobota_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: tyrobota_redis
    restart: always
    ports:
      - "6379:6379"